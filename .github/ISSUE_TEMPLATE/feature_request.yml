name: Feature request
description: Suggest a change to the page or the QR preview.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [What the plugin is planned to do](https://github.com/tahmidbintaslim/promptpay-storefront#what-the-plugin-is-planned-to-do) first. If your idea is already there, a comment about your use case on a related issue helps.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
